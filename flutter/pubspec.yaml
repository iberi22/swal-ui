name: swal_ui
description: >-
  SWAL design system for Flutter — "Bone Taller" theme (Bone stone neutrals +
  Taller orange accent), tokens generated from the web @swal/ui CSS.
version: 0.1.0
homepage: https://github.com/iberi22/swal-ui
repository: https://github.com/iberi22/swal-ui/tree/main/flutter
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # Fuentes OFL 1.1 (ver fonts/OFL-*.txt y LICENSE). Desde otra app se usan como
  # `packages/swal_ui/Inter`; SwalTheme ya lo hace por ti.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
